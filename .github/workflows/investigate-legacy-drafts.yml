name: Build verified 2007 draft evidence

on:
  push:
    branches: [feat/status-draft-history-hardening]
    paths:
      - '.github/workflows/investigate-legacy-drafts.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/status-draft-history-hardening
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - name: Enforce complete boards and admit the verified 2007 archive
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('scripts/build-draft-performance.py')
          text = path.read_text()
          replacements = [
            ("    checks = []\n    archive_sources = []\n", "    checks = []\n    skipped_boards = []\n    archive_sources = []\n"),
            ("        if year < 2008 or year == 2020:\n", "        if year < 2005 or year == 2020:\n"),
            ("        if not picks or not set(range(1, regular + 1)).issubset(completed):\n            continue\n        rows = source(f'{year}.csv', STATS_URL.format(year))\n",
             "        if not picks or not set(range(1, regular + 1)).issubset(completed):\n            continue\n        max_pick = max(p['overallPickNumber'] for p in picks)\n        present_picks = {p['overallPickNumber'] for p in picks}\n        missing_picks = sorted(set(range(1, max_pick + 1)) - present_picks)\n        if missing_picks:\n            skipped_boards.append({'season': year, 'recorded_picks': len(picks),\n                                   'max_overall_pick': max_pick, 'missing_overall_picks': missing_picks})\n            print(f'{year}: skipped incomplete draft board; missing overall picks {missing_picks}', flush=True)\n            continue\n        rows = source(f'{year}.csv', STATS_URL.format(year))\n"),
            ("                        'total_picks': max(p['overallPickNumber'] for p in picks),\n", "                        'total_picks': max_pick,\n"),
            ("        'sources': sources, 'archives': archive_sources, 'checks': checks,\n", "        'sources': sources, 'archives': archive_sources, 'checks': checks,\n        'skipped_incomplete_boards': skipped_boards,\n"),
          ]
          for before, after in replacements:
            if before not in text:
              raise SystemExit(f'Expected builder source not found: {before[:80]!r}')
            text = text.replace(before, after, 1)
          path.write_text(text)
          PY
      - name: Rebuild canonical draft evidence
        run: python3 scripts/build-draft-performance.py --cache-dir /tmp/grudge-draft-sources
      - name: Recalculate chronological validation
        run: |
          npm ci
          npm run models:validate
      - name: Commit verified evidence to the feature branch
        shell: bash
        run: |
          git config user.name "grudge-data-bot"
          git config user.email "actions@users.noreply.github.com"
          git add scripts/build-draft-performance.py data/derived/draft-performance.json data/derived/draft-performance-provenance.json data/derived/player-week-scores.json.gz data/derived/player-identities.json data/derived/model-evidence-manifest.json data/derived/draft-model-validation.json
          if git diff --cached --quiet; then
            echo "No generated changes"
            exit 0
          fi
          git commit -m "Extend verified draft evidence to 2007"
          git push origin HEAD:feat/status-draft-history-hardening
