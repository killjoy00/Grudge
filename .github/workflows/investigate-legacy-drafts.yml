name: Investigate legacy draft grades

on:
  push:
    branches: [feat/status-draft-history-hardening]
    paths:
      - '.github/workflows/investigate-legacy-drafts.yml'

permissions:
  contents: read

jobs:
  investigate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Translate 2005-2006 legacy fantasy IDs through authenticated ESPN history
        env:
          ESPN_SWID: ${{ secrets.ESPN_SWID }}
          ESPN_S2: ${{ secrets.ESPN_S2 }}
        shell: bash
        run: |
          if [ -z "$ESPN_SWID" ] || [ -z "$ESPN_S2" ]; then
            echo "ESPN credentials unavailable" | tee legacy-draft-investigation.txt
            exit 0
          fi
          python3 - <<'PY' | tee legacy-draft-investigation.txt
          import csv, io, json, os, re, urllib.error, urllib.request

          targets = {
            2005: [1868367,1869694,1951644,1953735,1962369,1867957,2129297,1921396,1870431,1868359,1868405,1869693,1954423,1869892,1870428,2014162,1951343,1868992],
            2006: [1951644,1869694,1953735,1953184,1956341,1941582,1921396,1868359,1946250,1868066,1954772,1949439,1869402,1952653,1868367,1949968,1869002],
          }
          cookie = f"SWID={os.environ['ESPN_SWID']}; espn_s2={os.environ['ESPN_S2']}"
          base = 'https://lm-api-reads.fantasy.espn.com/apis/v3/games/ffl'

          def norm(name):
            name = re.sub(r'\b(jr|sr|ii|iii|iv|v)\b', '', (name or '').lower())
            return re.sub(r'[^a-z0-9]', '', name)

          def request_json(url, fantasy_filter=None):
            headers = {'User-Agent':'Mozilla/5.0','Accept':'application/json','Cookie':cookie}
            if fantasy_filter is not None:
              headers['X-Fantasy-Filter'] = json.dumps(fantasy_filter, separators=(',',':'))
            req = urllib.request.Request(url, headers=headers)
            with urllib.request.urlopen(req, timeout=30) as response:
              return response.status, json.load(response)

          def collect_players(value):
            found = []
            def walk(node):
              if isinstance(node, dict):
                if isinstance(node.get('player'), dict) and node['player'].get('id') is not None:
                  found.append(node['player'])
                if node.get('id') is not None and (node.get('fullName') or node.get('displayName')) and ('defaultPositionId' in node or 'proTeamId' in node):
                  found.append(node)
                for child in node.values(): walk(child)
              elif isinstance(node, list):
                for child in node: walk(child)
            walk(value)
            dedup = {}
            for p in found:
              dedup[str(p.get('id'))] = p
            return list(dedup.values())

          stats = {}
          for year in targets:
            req = urllib.request.Request(
              f'https://github.com/nflverse/nflverse-data/releases/download/stats_player/stats_player_week_{year}.csv',
              headers={'User-Agent':'grudge-identity-audit/1.0'})
            with urllib.request.urlopen(req, timeout=60) as r:
              rows = list(csv.DictReader(io.TextIOWrapper(r, encoding='utf-8')))
            names = {}
            for row in rows:
              if row.get('season_type') != 'REG': continue
              names.setdefault(norm(row.get('player_display_name')), {})[row.get('player_id')] = row
            stats[year] = names

          for year, ids in targets.items():
            for ident in ids:
              filt = {'players': {'filterIds': {'value': [ident]}, 'limit': 10}}
              attempts = [
                f'{base}/leagueHistory/114052?seasonId={year}&view=kona_player_info',
                f'{base}/seasons/{year}/segments/0/leagues/114052?view=kona_player_info',
              ]
              result = {'season':year,'legacy_id':ident,'source':None,'players':[]}
              for url in attempts:
                try:
                  status, data = request_json(url, filt)
                  players = collect_players(data)
                  exact = [p for p in players if str(p.get('id')) == str(ident)]
                  if exact:
                    result['source'] = 'leagueHistory' if 'leagueHistory' in url else 'season'
                    result['players'] = exact
                    break
                  if players and not result['players']:
                    result['players'] = players[:3]
                except urllib.error.HTTPError as error:
                  result.setdefault('http', []).append(error.code)
                except Exception as error:
                  result.setdefault('errors', []).append(type(error).__name__)
              compact = []
              for p in result.pop('players', []):
                name = p.get('fullName') or p.get('displayName')
                candidates = list(stats[year].get(norm(name), {}).values()) if name else []
                unique = {r.get('player_id'): r for r in candidates}
                compact.append({
                  'espn_id':p.get('id'),'name':name,'position_id':p.get('defaultPositionId'),'pro_team_id':p.get('proTeamId'),
                  'nflverse':[{'gsis_id':r.get('player_id'),'name':r.get('player_display_name'),'position':r.get('position')} for r in unique.values()],
                })
              result['players'] = compact
              print(json.dumps(result, sort_keys=True))
          PY
      - uses: actions/upload-artifact@v7
        with:
          name: legacy-draft-investigation
          path: legacy-draft-investigation.txt
          retention-days: 2
