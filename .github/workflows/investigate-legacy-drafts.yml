name: Finalize draft coverage and verify

on:
  push:
    branches: [feat/status-draft-history-hardening]
    paths:
      - '.github/workflows/investigate-legacy-drafts.yml'

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/status-draft-history-hardening
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - name: Update evidence boundary documentation
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          replacements = {
            'components/DraftRecordsSection.tsx': [
              ("2005–2007 remain board-only because their older player-ID namespace is unresolved. Model 2026.3 keeps each published result for comparison.",
               "The complete 2007 board is graded after reviewed historical player-identity recovery. The 2005 and 2006 archives remain board-only because their recovered boards themselves are incomplete (119 of 128 and 129 of 160 pick rows respectively); those seasons stay withheld even where individual identities can be resolved. Model 2026.3 keeps each published result for comparison."),
            ],
            'docs/MODEL-EVIDENCE.md': [
              ("The committed corpus contains **132,360 player-weeks, 2,491 offensive picks, and 17 complete seasons (2008–2025, excluding 2020)**. Unrostered players are included.",
               "The committed corpus contains **139,614 player-weeks, 2,630 offensive picks, and 18 complete seasons (2007–2025, excluding 2020)**. Unrostered players are included. The recovered 2005 and 2006 boards are deliberately withheld from grading because they contain only 119 of 128 and 129 of 160 overall-pick rows respectively; resolvable player identities do not make an incomplete board complete."),
              ("Across **2,047 picks in 14 held-out seasons**, pick expectation had **MAE 13.5229 / RMSE 18.9556**, compared with **16.5245 / 21.7593** for a constant prior-season production expectation.",
               "Across **2,197 picks in 15 held-out seasons**, pick expectation had **MAE 13.5573 / RMSE 18.9611**, compared with **16.6404 / 21.7559** for a constant prior-season production expectation."),
            ],
            'docs/LEAGUE-HISTORY.md': [
              ("- draft recap boards back to 2005.\n\nThe recovery also established the limits:",
               "- draft recap boards back to 2005.\n\nDraft-board recovery is not the same as grade completeness. The 2007 board is complete and now supports the canonical performance model. The recovered 2005 board contains 119 of 128 overall-pick rows and 2006 contains 129 of 160, so both remain visible as source history but are deliberately withheld from performance grading.\n\nThe recovery also established the limits:"),
            ],
            'README.md': [
              ("The league did not play in 2020. Never invent data to fill an evidence gap.",
               "The league did not play in 2020. Draft performance grades begin with the complete 2007 board; the recovered 2005–2006 boards remain source history only because they are incomplete. Never invent data to fill an evidence gap."),
            ],
            'lib/admin-status.ts': [
              ("githubJson<GitHubRunsResponse>('/actions/runs?per_page=50')", "githubJson<GitHubRunsResponse>('/actions/runs?per_page=100')"),
            ],
          }

          for filename, pairs in replacements.items():
            path = Path(filename)
            text = path.read_text()
            for before, after in pairs:
              if before not in text:
                raise SystemExit(f'Expected text not found in {filename}: {before[:100]!r}')
              text = text.replace(before, after, 1)
            path.write_text(text)
          PY
      - name: Verify application and regression suite
        shell: bash
        env:
          VERCEL_ENV: preview
        run: |
          npm ci
          npm audit --audit-level=moderate
          npm run typecheck
          npm test
          npm run build
      - name: Commit verified documentation and UI coverage changes
        shell: bash
        run: |
          git config user.name "grudge-data-bot"
          git config user.email "actions@users.noreply.github.com"
          git add components/DraftRecordsSection.tsx docs/MODEL-EVIDENCE.md docs/LEAGUE-HISTORY.md README.md lib/admin-status.ts
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Document strict 2007 draft coverage"
          git push origin HEAD:feat/status-draft-history-hardening
