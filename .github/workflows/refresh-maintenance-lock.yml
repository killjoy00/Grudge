name: Refresh maintenance lockfile

on:
  push:
    branches: [chatgpt/maintenance-email-actions-audit]
    paths:
      - 'package.json'
      - '.github/workflows/refresh-maintenance-lock.yml'

permissions:
  contents: write

concurrency:
  group: refresh-maintenance-lock
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Regenerate lockfile
        run: npm install --package-lock-only --ignore-scripts

      - name: Verify dependency audit
        run: npm audit --audit-level=moderate

      - name: Commit lockfile
        run: |
          git config user.name 'grudge-maintenance[bot]'
          git config user.email 'grudge-maintenance[bot]@users.noreply.github.com'
          git add package-lock.json
          if git diff --cached --quiet; then
            echo 'Lockfile already current.'
          else
            git commit -m 'Refresh lockfile for patched PostCSS'
            git push
          fi
