name: Rebuild historical player registry evidence

on:
  push:
    branches: [fix/seed-historical-player-registry]
    paths:
      - '.github/workflows/rebuild-historical-player-registry.yml'

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/seed-historical-player-registry
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: npm ci
      - name: Apply source patch
        run: node scripts/apply-historical-player-registry-patch.mjs
      - name: Rebuild committed historical evidence
        run: npm run models:build-data
      - name: Validate publication inputs
        run: npm run models:refresh -- --dry-run
      - name: Run typecheck and tests
        run: |
          npm run typecheck
          npm test
      - name: Remove one-time helpers and commit
        run: |
          git rm scripts/apply-historical-player-registry-patch.mjs .github/workflows/rebuild-historical-player-registry.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/build-draft-performance.py scripts/refresh-model-results.ts pipeline/draft-model.ts pipeline/player-import.ts pipeline/historical-player-registry.test.ts data/derived
          git commit -m "Seed historical player registry before score import"
          git push origin HEAD:fix/seed-historical-player-registry
