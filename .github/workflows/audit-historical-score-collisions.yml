name: Audit historical score collisions

on:
  push:
    branches: [fix/historical-score-delete-permission]
    paths:
      - '.github/workflows/audit-historical-score-collisions.yml'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/historical-score-delete-permission
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Audit role membership
        env:
          NEON_URL: ${{ secrets.PIPELINE_DATABASE_URL }}
        run: |
          node scripts/neon-sql.mjs -c "select current_user, r.rolsuper, r.rolbypassrls, pg_has_role(current_user,'neon_superuser','member') as neon_superuser_member, pg_has_role(current_user,'neondb_owner','member') as owner_member from pg_roles r where r.rolname=current_user"
