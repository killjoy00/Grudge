name: Probe legacy draft alternate sources

on:
  push:
    branches: [investigate/legacy-draft-blanks]
    paths:
      - '.github/workflows/probe-legacy-draft-alternates.yml'
      - 'scripts/probe-legacy-draft-alternates.mjs'
      - 'scripts/probe-legacy-transactions.mjs'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Probe authenticated ESPN representations
        env:
          ESPN_SWID: ${{ secrets.ESPN_SWID }}
          ESPN_S2: ${{ secrets.ESPN_S2 }}
        run: node scripts/probe-legacy-draft-alternates.mjs
      - name: Probe filtered legacy transactions
        env:
          ESPN_SWID: ${{ secrets.ESPN_SWID }}
          ESPN_S2: ${{ secrets.ESPN_S2 }}
        run: node scripts/probe-legacy-transactions.mjs
      - uses: actions/upload-artifact@v7
        with:
          name: legacy-draft-probe
          path: |
            legacy-draft-probe.json
            legacy-transaction-probe.json
          retention-days: 1
