name: Apply recap provider receipts

on:
  push:
    branches:
      - ops/recap-provider-reconcile
    paths:
      - 'ops/recap-provider-receipts.json'
      - 'scripts/apply-recap-provider-receipts.ts'
      - '.github/workflows/apply-recap-provider-receipts.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: recap-provider-receipts
  cancel-in-progress: false

jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply privacy-preserving provider receipts
        env:
          PIPELINE_DATABASE_URL: ${{ secrets.PIPELINE_DATABASE_URL }}
        run: npx tsx scripts/apply-recap-provider-receipts.ts

      - name: Verify watchdog view after reconciliation
        env:
          PIPELINE_DATABASE_URL: ${{ secrets.PIPELINE_DATABASE_URL }}
        run: |
          set -euo pipefail
          season=$(jq -r '.season' ops/recap-provider-receipts.json)
          week=$(jq -r '.week' ops/recap-provider-receipts.json)
          extra=''
          if jq -e '.receipts | length > 0 and all(.status == "delivered" or .status == "opened" or .status == "clicked")'               ops/recap-provider-receipts.json >/dev/null; then
            extra='--require-delivered'
          fi
          npx tsx pipeline/reconcile-recap-provider.ts             --season="$season"             --week="$week"             $extra
