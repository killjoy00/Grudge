name: Recap delivery watchdog

# The primary path runs immediately after a recap-capable Weekly pipeline
# finishes. Three later Tuesday checks are deliberate fallbacks for GitHub cron
# delay/misses and for mailbox-level Resend delivery verification.
# send-recap.ts is idempotent per season/week/recipient, so retries cannot create
# duplicate league emails once recap_deliveries says a recipient was sent.
on:
  workflow_run:
    workflows: ['Weekly pipeline']
    types: [completed]
  schedule:
    - cron: '0 17 * * 2'
    - cron: '0 20 * * 2'
    - cron: '0 23 * * 2'
  workflow_dispatch:

concurrency:
  group: recap-delivery-watchdog
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  watchdog:
    # Scheduled Weekly runs send recaps. The new Tuesday morning marker is a
    # push-triggered recap path, so let push completions reach the classifier
    # below too. Explicit .weekly-pipeline-request pushes remain no-recap and
    # are filtered there by inspecting the exact upstream commit.
    if: >-
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.event == 'schedule' ||
      github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Classify recap-capable upstream run
        id: mode
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          UPSTREAM_EVENT: ${{ github.event.workflow_run.event }}
          UPSTREAM_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail

          recap_capable=true
          reason='direct watchdog schedule/manual check'

          if [ "$EVENT_NAME" = 'workflow_run' ]; then
            if [ "$UPSTREAM_EVENT" = 'schedule' ]; then
              reason='scheduled Weekly pipeline sends recap'
            elif [ "$UPSTREAM_EVENT" = 'push' ]; then
              recap_capable=false
              reason='explicit push retry does not send recap'

              if [ -z "$UPSTREAM_SHA" ] || ! git cat-file -e "$UPSTREAM_SHA^{commit}" 2>/dev/null; then
                echo "::error::Cannot resolve upstream Weekly pipeline commit '$UPSTREAM_SHA'."
                exit 1
              fi

              parent="${UPSTREAM_SHA}^1"
              if ! git cat-file -e "$parent^{commit}" 2>/dev/null; then
                echo "::error::Cannot resolve parent of upstream Weekly pipeline commit $UPSTREAM_SHA."
                exit 1
              fi

              if git diff --name-only "$parent" "$UPSTREAM_SHA" \
                | grep -Fxq '.weekly-morning-request'; then
                recap_capable=true
                reason='independent Tuesday morning marker push sends recap'
              fi
            else
              recap_capable=false
              reason="upstream $UPSTREAM_EVENT Weekly pipeline is not an automatic recap path"
            fi
          fi

          echo "recap_capable=$recap_capable" >> "$GITHUB_OUTPUT"
          echo "reason=$reason" >> "$GITHUB_OUTPUT"
          echo "Recap-capable: $recap_capable ($reason)"

      - uses: actions/setup-node@v7
        if: steps.mode.outputs.recap_capable == 'true'
        with:
          node-version: 22
          cache: npm

      - name: Install
        if: steps.mode.outputs.recap_capable == 'true'
        run: npm ci

      - name: Verify production schema contract
        if: steps.mode.outputs.recap_capable == 'true'
        env:
          PIPELINE_DATABASE_URL: ${{ secrets.PIPELINE_DATABASE_URL }}
        run: npm run schema:verify

      - name: Check current recap state
        id: preflight
        if: steps.mode.outputs.recap_capable == 'true'
        env:
          PIPELINE_DATABASE_URL: ${{ secrets.PIPELINE_DATABASE_URL }}
        run: npx tsx pipeline/recap-delivery-check.ts

      - name: Retry unsent recap deliveries
        if: steps.mode.outputs.recap_capable == 'true' && steps.preflight.outputs.missing != '0'
        env:
          PIPELINE_DATABASE_URL: ${{ secrets.PIPELINE_DATABASE_URL }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RECAP_FROM_EMAIL: 'Grudge Match <recap@grudge.planitnow.us>'
          RECAP_SITE_URL: ${{ vars.RECAP_SITE_URL }}
          INPUT_SEASON: ${{ steps.preflight.outputs.season }}
          INPUT_WEEK: ${{ steps.preflight.outputs.week }}
        run: |
          npm run recap -- \
            --season="$INPUT_SEASON" \
            --week="$INPUT_WEEK"

      - name: Confirm every eligible member was accepted by Resend
        id: sendcheck
        if: >-
          always() &&
          steps.mode.outputs.recap_capable == 'true' &&
          steps.preflight.outcome == 'success'
        env:
          PIPELINE_DATABASE_URL: ${{ secrets.PIPELINE_DATABASE_URL }}
          INPUT_SEASON: ${{ steps.preflight.outputs.season }}
          INPUT_WEEK: ${{ steps.preflight.outputs.week }}
        run: |
          npx tsx pipeline/recap-delivery-check.ts \
            --season="$INPUT_SEASON" \
            --week="$INPUT_WEEK" \
            --require-complete

      - name: Reconcile actual Resend delivery
        id: provider
        if: >-
          always() &&
          steps.mode.outputs.recap_capable == 'true' &&
          steps.preflight.outcome == 'success' &&
          steps.sendcheck.outcome == 'success'
        env:
          PIPELINE_DATABASE_URL: ${{ secrets.PIPELINE_DATABASE_URL }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          INPUT_SEASON: ${{ steps.preflight.outputs.season }}
          INPUT_WEEK: ${{ steps.preflight.outputs.week }}
          MISSING_BEFORE_RETRY: ${{ steps.preflight.outputs.missing }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_SCHEDULE: ${{ github.event.schedule }}
        run: |
          extra=''

          # workflow_run fires seconds after the primary send, so it records
          # current provider state but does not mistake normal transit time for
          # failure. Later scheduled checks require true delivery.
          if [ "$EVENT_NAME" != 'workflow_run' ] && [ "$MISSING_BEFORE_RETRY" = '0' ]; then
            extra='--require-delivered'
          fi

          # The last Tuesday fallback is authoritative even if it had to repair
          # a missed send itself. Give those fresh messages three minutes to
          # leave normal transit before requiring mailbox delivery.
          if [ "$EVENT_SCHEDULE" = '0 23 * * 2' ]; then
            if [ "$MISSING_BEFORE_RETRY" != '0' ]; then
              sleep 180
            fi
            extra='--require-delivered'
          fi

          # A manual watchdog run is an explicit verification request. If it had
          # to send anything, allow the same short transit window as the final
          # scheduled check before requiring delivery.
          if [ "$EVENT_NAME" = 'workflow_dispatch' ]; then
            if [ "$MISSING_BEFORE_RETRY" != '0' ]; then
              sleep 180
            fi
            extra='--require-delivered'
          fi

          npx tsx pipeline/reconcile-recap-provider.ts \
            --season="$INPUT_SEASON" \
            --week="$INPUT_WEEK" \
            $extra

      - name: Alert on watchdog failure
        if: failure()
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RECAP_FROM_EMAIL: 'Grudge Match <recap@grudge.planitnow.us>'
          ALERT_EMAIL: ${{ vars.PIPELINE_ALERT_EMAIL }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          TRIGGER: ${{ github.event_name }}
        run: |
          if [ -z "$RESEND_API_KEY" ] || [ -z "$RECAP_FROM_EMAIL" ] || [ -z "$ALERT_EMAIL" ]; then
            echo "::warning::Recap watchdog failed and NO ALERT WAS SENT. Set PIPELINE_ALERT_EMAIL and RESEND_API_KEY."
            exit 0
          fi
          body=$(jq -n \
            --arg from "$RECAP_FROM_EMAIL" \
            --arg to "$ALERT_EMAIL" \
            --arg subject "Grudge recap watchdog FAILED ($TRIGGER) -- $(date -u +'%a %-d %b')" \
            --arg url "$RUN_URL" \
            '{from: $from, to: [$to], subject: $subject, text: ("The Grudge Tuesday recap watchdog found an unsettled week, an incomplete send, or a Resend delivery/bounce problem.\n\nLogs: " + $url)}')
          code=$(curl -sS -X POST https://api.resend.com/emails \
            -H "Authorization: Bearer $RESEND_API_KEY" \
            -H 'Content-Type: application/json' \
            -d "$body" -o /tmp/alert.json -w '%{http_code}')
          echo "Resend responded $code"
          cat /tmp/alert.json || true

      - name: Summary
        if: always()
        run: |
          {
            echo "### Recap delivery watchdog"
            echo ""
            echo "- Result: **${{ job.status }}**"
            echo "- Recap-capable path: **${{ steps.mode.outputs.recap_capable || 'unknown' }}** — ${{ steps.mode.outputs.reason || 'not classified' }}"
            echo "- Season/week: **${{ steps.preflight.outputs.season || 'not resolved' }} / ${{ steps.preflight.outputs.week || 'not resolved' }}**"
            echo "- Eligible recipients: **${{ steps.preflight.outputs.eligible || 'unknown' }}**"
            echo "- Accepted by Resend before retry: **${{ steps.preflight.outputs.sent || 'unknown' }}**"
            echo "- Missing before retry: **${{ steps.preflight.outputs.missing || 'unknown' }}**"
            echo "- Confirmed delivered by Resend: **${{ steps.provider.outputs.provider_delivered || 'not checked' }}**"
            echo "- Provider pending: **${{ steps.provider.outputs.provider_pending || 'not checked' }}**"
            echo "- Provider failures: **${{ steps.provider.outputs.provider_failed || 'not checked' }}**"
            echo "- Provider lookup errors: **${{ steps.provider.outputs.provider_lookup_errors || 'not checked' }}**"
            echo "- Trigger: **${{ github.event_name }}**"
          } >> "$GITHUB_STEP_SUMMARY"
