name: Weekly pipeline

on:
  schedule:
    # GitHub schedule is best-effort. Keep these as internal backstops, but the
    # independent .weekly-morning-request push below is the primary Tuesday
    # trigger because normal push events have not shown the multi-hour cron lag.
    - cron: '17 7 * * 2'
      timezone: 'America/Chicago'
    - cron: '57 7 * * 2'
      timezone: 'America/Chicago'
    - cron: '47 8 * * 2'
      timezone: 'America/Chicago'
    - cron: '7 10 * * 2'
      timezone: 'America/Chicago'
  push:
    branches: [main]
    paths:
      # Explicit current-season retry. Preserves the long-standing behavior:
      # run the pipeline, but never surprise the league with a recap email.
      - '.weekly-pipeline-request'
      # Independent Tuesday scheduler marker. This is a safe recap-capable
      # trigger and is database-gated exactly like an on.schedule backstop.
      - '.weekly-morning-request'
  workflow_dispatch:
    inputs:
      season:
        description: 'Season to load (blank = current year)'
        required: false
        type: string
      send_recap:
        description: 'Send the latest completed week recap after a successful manual run'
        required: true
        default: false
        type: boolean

concurrency:
  group: weekly-pipeline
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v7
        with:
          # Needed to classify which marker changed on push without calling an
          # external API. The first parent is enough for normal/direct commits
          # and GitHub merge commits to main.
          fetch-depth: 2

      - name: Classify trigger
        id: trigger
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          mode="$EVENT_NAME"
          morning=false

          if [ "$EVENT_NAME" = 'push' ]; then
            parent="${GITHUB_SHA}^1"
            if git rev-parse "$parent" >/dev/null 2>&1 \
              && git diff --name-only "$parent" "$GITHUB_SHA" \
                | grep -Fxq '.weekly-morning-request'; then
              mode='morning'
              morning=true
            else
              mode='push'
            fi
          fi

          echo "mode=$mode" >> "$GITHUB_OUTPUT"
          echo "morning=$morning" >> "$GITHUB_OUTPUT"
          echo "Weekly trigger mode: $mode"

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Install
        run: npm ci

      - name: Decide whether this trigger still needs the weekly run
        id: gate
        env:
          PIPELINE_DATABASE_URL: ${{ secrets.PIPELINE_DATABASE_URL }}
          TRIGGER_MODE: ${{ steps.trigger.outputs.mode }}
        run: npx tsx pipeline/weekly-run-gate.ts

      # No production write is allowed until code tests and the database schema
      # both agree with this commit's canonical identity contract.
      - name: Test
        if: steps.gate.outputs.should_run == 'true'
        run: npx tsx --test pipeline/*.test.ts lib/*.test.ts
      - name: Verify production schema contract
        if: steps.gate.outputs.should_run == 'true'
        env:
          PIPELINE_DATABASE_URL: ${{ secrets.PIPELINE_DATABASE_URL }}
        run: npm run schema:verify

      - name: Fetch ESPN data and load
        if: steps.gate.outputs.should_run == 'true'
        env:
          PIPELINE_DATABASE_URL: ${{ secrets.PIPELINE_DATABASE_URL }}
          INPUT_SEASON: ${{ inputs.season }}
        run: |
          if [ -n "$INPUT_SEASON" ]; then
            npx tsx pipeline/run.ts --season="$INPUT_SEASON"
          else
            npx tsx pipeline/run.ts
          fi

      - name: Compute derived features
        if: steps.gate.outputs.should_run == 'true'
        env:
          PIPELINE_DATABASE_URL: ${{ secrets.PIPELINE_DATABASE_URL }}
        run: npx tsx pipeline/compute.ts

      - name: Score predictions
        if: steps.gate.outputs.should_run == 'true'
        env:
          PIPELINE_DATABASE_URL: ${{ secrets.PIPELINE_DATABASE_URL }}
        run: npx tsx pipeline/score-predictions.ts

      - name: Capture the week ahead
        if: steps.gate.outputs.should_run == 'true'
        env:
          PIPELINE_DATABASE_URL: ${{ secrets.PIPELINE_DATABASE_URL }}
        run: npx tsx pipeline/preview.ts

      # Completed-season identities/results are regenerated from the archive;
      # mid-season this is idempotent and leaves current identities intact.
      - name: Rebuild league history
        if: steps.gate.outputs.should_run == 'true'
        env:
          PIPELINE_DATABASE_URL: ${{ secrets.PIPELINE_DATABASE_URL }}
        run: npm run history:refresh

      - name: Capture free-agent ownership
        if: steps.gate.outputs.should_run == 'true'
        env:
          PIPELINE_DATABASE_URL: ${{ secrets.PIPELINE_DATABASE_URL }}
        run: npx tsx pipeline/ownership.ts

      - name: Restore NFL source cache
        if: steps.gate.outputs.should_run == 'true'
        uses: actions/cache@v4
        with:
          path: /tmp/grudge-draft-sources
          key: nfl-draft-sources-${{ hashFiles('scripts/build-draft-performance.py', 'data/**/league.json.gz') }}
          restore-keys: nfl-draft-sources-

      - name: Build complete regular-season player scoring
        if: steps.gate.outputs.should_run == 'true'
        run: npm run models:build-data

      - name: Publish validated model results
        if: steps.gate.outputs.should_run == 'true'
        env:
          PIPELINE_DATABASE_URL: ${{ secrets.PIPELINE_DATABASE_URL }}
        run: npm run models:refresh

      - name: Commit raw data
        if: steps.gate.outputs.should_run == 'true'
        id: commit
        run: |
          git config user.name 'grudge-pipeline[bot]'
          git config user.email 'grudge-pipeline[bot]@users.noreply.github.com'
          git add data/
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No new raw data this run."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            git commit -m "Weekly data $(date -u +%Y-%m-%d)

          Automated capture from the ESPN v3 API."
            git push
          fi

      - name: Send weekly recap
        if: steps.gate.outputs.should_run == 'true' && (github.event_name == 'schedule' || inputs.send_recap == true || steps.trigger.outputs.morning == 'true')
        env:
          PIPELINE_DATABASE_URL: ${{ secrets.PIPELINE_DATABASE_URL }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RECAP_FROM_EMAIL: 'Grudge Match <recap@grudge.planitnow.us>'
          RECAP_SITE_URL: ${{ vars.RECAP_SITE_URL }}
          INPUT_SEASON: ${{ inputs.season }}
        run: |
          if [ -n "$INPUT_SEASON" ]; then
            npm run recap -- --season="$INPUT_SEASON" --skip-if-empty
          else
            npm run recap -- --skip-if-empty
          fi

      - name: Alert on failure
        if: failure()
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RECAP_FROM_EMAIL: 'Grudge Match <recap@grudge.planitnow.us>'
          ALERT_EMAIL: ${{ vars.PIPELINE_ALERT_EMAIL }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          TRIGGER: ${{ steps.trigger.outputs.mode || github.event_name }}
        run: |
          if [ -z "$RESEND_API_KEY" ] || [ -z "$RECAP_FROM_EMAIL" ] || [ -z "$ALERT_EMAIL" ]; then
            echo "::warning::Pipeline failed and NO ALERT WAS SENT. Set PIPELINE_ALERT_EMAIL and RESEND_API_KEY."
            exit 0
          fi
          body=$(jq -n \
            --arg from "$RECAP_FROM_EMAIL" \
            --arg to "$ALERT_EMAIL" \
            --arg subject "Grudge pipeline FAILED ($TRIGGER) -- $(date -u +'%a %-d %b')" \
            --arg url "$RUN_URL" \
            '{from: $from, to: [$to], subject: $subject, text: ("The weekly Grudge pipeline failed. The site remains on the previous successful data snapshot.\n\nLogs: " + $url)}')
          code=$(curl -sS -X POST https://api.resend.com/emails \
            -H "Authorization: Bearer $RESEND_API_KEY" \
            -H 'Content-Type: application/json' \
            -d "$body" -o /tmp/alert.json -w '%{http_code}')
          echo "Resend responded $code"
          cat /tmp/alert.json || true

      - name: Summary
        if: always()
        run: |
          {
            echo "### Weekly pipeline"
            echo ""
            echo "- Result: **${{ job.status }}**"
            echo "- Trigger mode: **${{ steps.trigger.outputs.mode || github.event_name }}**"
            echo "- Gate: **${{ steps.gate.outputs.should_run || 'unknown' }}** — ${{ steps.gate.outputs.reason || 'not resolved' }}"
            echo "- Schema contract checked before writes: **${{ steps.gate.outputs.should_run == 'true' }}**"
            echo "- New raw data committed: **${{ steps.commit.outputs.changed || 'no' }}**"
            echo "- Recap requested: **${{ steps.gate.outputs.should_run == 'true' && (github.event_name == 'schedule' || inputs.send_recap == true || steps.trigger.outputs.morning == 'true') }}**"
            echo "- Run: \`$(date -u +'%Y-%m-%d %H:%M UTC')\`"
          } >> "$GITHUB_STEP_SUMMARY"
