name: Build legacy draft performance

on:
  push:
    branches:
      - chatgpt/legacy-draft-grades
    paths:
      - 'scripts/build-legacy-draft-performance.mjs'
      - '.github/workflows/build-legacy-draft-performance.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build dataset
        run: node scripts/build-legacy-draft-performance.mjs
      - name: Commit generated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/derived/legacy-draft-performance.csv
          git diff --cached --quiet && exit 0
          git commit -m "Generate legacy draft performance data"
          git push origin HEAD:chatgpt/legacy-draft-grades
