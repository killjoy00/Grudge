name: Refresh NFL player ledger

on:
  workflow_dispatch:
  schedule:
    - cron: '30 12 * * *'
  push:
    branches: [main]
    paths:
      - 'scripts/build-player-data.py'
      - 'scripts/player_scoring.py'
      - 'scripts/import-player-data.ts'
      - 'pipeline/player-import.ts'
      - 'data/player-name-aliases.json'
      - 'data/derived/players/**'
      - '.github/workflows/refresh-players.yml'

concurrency:
  group: weekly-pipeline
  cancel-in-progress: false
permissions:
  contents: read

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: npm ci
      - name: Validate committed backfill
        run: node --import tsx scripts/import-player-data.ts --dry-run
      - name: Refresh current and prior NFL seasons
        run: |
          NFL_SEASON=$(python3 -c 'import datetime; d=datetime.date.today(); print(d.year-int(d.month<3))')
          python3 scripts/build-player-data.py --seasons "$((NFL_SEASON-1)):$NFL_SEASON" --refresh
      - name: Validate and publish changed seasons
        env:
          PIPELINE_DATABASE_URL: ${{ secrets.PIPELINE_DATABASE_URL }}
        run: node --import tsx scripts/import-player-data.ts
      - name: Retain source receipts and validated artifacts
        uses: actions/upload-artifact@v7
        with:
          name: player-ledger-${{ github.run_id }}
          path: data/derived/players/
          retention-days: 14
