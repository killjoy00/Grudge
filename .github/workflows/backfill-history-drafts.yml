name: Backfill historical ESPN drafts

on:
  workflow_dispatch:
    inputs:
      from_season:
        description: 'First season to repair'
        required: true
        default: '2018'
        type: string
      to_season:
        description: 'Last season to repair'
        required: true
        default: '2025'
        type: string

concurrency:
  group: weekly-pipeline
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Validate requested range
        shell: bash
        run: |
          from='${{ inputs.from_season }}'
          to='${{ inputs.to_season }}'
          if ! [[ "$from" =~ ^[0-9]{4}$ && "$to" =~ ^[0-9]{4}$ ]]; then
            echo '::error::Season inputs must be four-digit years.'
            exit 1
          fi
          if [ "$from" -lt 2018 ] || [ "$to" -gt 2025 ] || [ "$from" -gt "$to" ]; then
            echo '::error::Draft repair is limited to 2018-2025.'
            exit 1
          fi

      - name: Check temporary ESPN credentials
        env:
          ESPN_SWID: ${{ secrets.ESPN_SWID }}
          ESPN_S2: ${{ secrets.ESPN_S2 }}
        run: |
          if [ -z "$ESPN_SWID" ] || [ -z "$ESPN_S2" ]; then
            echo '::error::Add temporary repository secrets ESPN_SWID and ESPN_S2 before running this workflow.'
            exit 1
          fi

      - name: Probe historical draft access
        env:
          ESPN_SWID: ${{ secrets.ESPN_SWID }}
          ESPN_S2: ${{ secrets.ESPN_S2 }}
        run: npm run history:drafts -- --from=${{ inputs.from_season }} --to=${{ inputs.to_season }} --probe

      - name: Fetch missing draft boards
        env:
          ESPN_SWID: ${{ secrets.ESPN_SWID }}
          ESPN_S2: ${{ secrets.ESPN_S2 }}
        run: npm run history:drafts -- --from=${{ inputs.from_season }} --to=${{ inputs.to_season }}

      - name: Verify application tests
        run: npm test

      - name: Commit repaired archive
        id: commit
        run: |
          git config user.name 'grudge-history[bot]'
          git config user.email 'grudge-history[bot]@users.noreply.github.com'
          git add data/history
          if git diff --cached --quiet; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
            echo 'No archive changes were produced.'
          else
            echo 'changed=true' >> "$GITHUB_OUTPUT"
            git commit -m "Backfill ESPN draft boards ${{ inputs.from_season }}-${{ inputs.to_season }}"
            git push origin HEAD:main
          fi

      - name: Import draft boards into production
        env:
          PIPELINE_DATABASE_URL: ${{ secrets.PIPELINE_DATABASE_URL }}
        run: npx tsx scripts/import-history-drafts.ts

      - name: Summary
        if: always()
        run: |
          {
            echo '### Historical ESPN draft repair'
            echo ''
            echo '- Seasons requested: **${{ inputs.from_season }}-${{ inputs.to_season }}**'
            echo "- Archive changed: **${{ steps.commit.outputs.changed || 'no' }}**"
            echo "- Result: **${{ job.status }}**"
            echo ''
            echo 'This repair changes only mDraftDetail inside existing historical archives.'
            echo 'After a successful run, delete the temporary ESPN_SWID and ESPN_S2 repository secrets.'
          } >> "$GITHUB_STEP_SUMMARY"
