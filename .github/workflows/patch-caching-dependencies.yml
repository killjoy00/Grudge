name: Patch dependency audit for cached reports PR
on:
  push:
    branches: [perf/grudge-public-report-isr-20261027]
    paths: ['.github/workflows/patch-caching-dependencies.yml']

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: perf/grudge-public-report-isr-20261027
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Update lockfile to patched dependencies
        run: npm audit fix --package-lock-only
      - name: Verify audit
        run: npm audit --audit-level=moderate
      - name: Push patched lockfile to feature branch
        run: |
          git add package.json package-lock.json
          if ! git diff --cached --quiet; then
            git config user.name 'grudge-dependency-maintenance[bot]'
            git config user.email 'grudge-dependency-maintenance[bot]@users.noreply.github.com'
            git commit -m 'chore: resolve Next.js and transitive dependency advisories'
            git push origin HEAD:refs/heads/perf/grudge-public-report-isr-20261027
          fi
