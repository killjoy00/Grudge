name: Apply historical score delete grant

on:
  push:
    branches: [fix/historical-score-delete-permission]
    paths:
      - '.github/workflows/apply-historical-score-delete-grant.yml'

permissions:
  contents: read

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/historical-score-delete-permission
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Apply narrow table grant
        env:
          NEON_URL: ${{ secrets.PIPELINE_DATABASE_URL }}
        run: node scripts/neon-sql.mjs scripts/migrations/2026-09-18-historical-score-refresh-delete.sql
      - name: Verify grant
        env:
          NEON_URL: ${{ secrets.PIPELINE_DATABASE_URL }}
        run: node scripts/neon-sql.mjs -c "do \$check\$ begin if not has_table_privilege('app_pipeline','public.player_week_scores','DELETE') then raise exception 'pipeline DELETE grant missing'; end if; end \$check\$"
