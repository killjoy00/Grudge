name: Verify 2005 model corpus count

on:
  push:
    branches: [fix/grade-2005-draft]
    paths:
      - '.github/workflows/probe-2005-model-count.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run models:refresh -- --dry-run
