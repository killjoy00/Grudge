name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      # Runs against the seven real seasons archived in data/history/, so this
      # checks the normalizer and the feature models against actual ESPN
      # payloads rather than fixtures written to match my own assumptions.
      - name: Pipeline tests
        run: npx tsx --test pipeline/*.test.ts

      - name: Build
        env:
          # Build-time placeholders. The real values live in Vercel; nothing
          # here connects to a database or to Clerk.
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: pk_test_placeholder
          CLERK_SECRET_KEY: sk_test_placeholder
          APP_DATABASE_URL: postgresql://placeholder@localhost/placeholder
        run: npx next build

  rls:
    name: RLS attack suite
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      # The suite spins up its own throwaway Postgres and applies the schema
      # straight out of docs/SCHEMA_PROPOSAL.md, so the document and the thing
      # being tested cannot drift apart.
      - name: Install PostgreSQL
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql postgresql-contrib

      - name: Run attack suite
        run: |
          export PGBIN=$(ls -d /usr/lib/postgresql/*/bin | tail -1)
          ./tests/rls/run.sh
